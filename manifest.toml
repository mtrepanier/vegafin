#
# Vega app manifest for VegaFin.
#
# The [needs.module] list below is not hand-written: `npm run build:debug` autolinks it
# from package.json dependencies and rewrites this file in place (confirmed by actually
# running the build against Vega SDK 0.24.9914 - one real .vpkg produced per architecture).
# After ADDING a dependency that ships a Vega native module, rebuild once to let autolinking
# add the entry for you.
#
# Correction: autolinking is additive-only - confirmed on-device when dropping
# `@amazon-devices/react-native-vector-icons` (see Icon.tsx) left its `vector_icons_2` entry
# behind after a rebuild, even though the tool's own "dependencies to add" log correctly
# stopped listing it. After REMOVING a dependency, a rebuild alone won't clean up its now-stale
# entry - delete that `[[needs.module]]` block by hand.
#
schema-version = 1

[package]
id = "com.vegafin.app"
title = "VegaFin"
version = "0.3.0"
# 512x512 PNG at assets/image/icon.png - referenced by filename via the @image/ prefix, per
# the Vega app manifest spec (PNG, 512x512, placed under assets/image/).
icon = "@image/icon.png"

[os.version]
min = "1.2"
target = "1.2"

# Playback services, not tied to any npm dependency so not autolinked - required to reach
# the OS's media pipeline at all. Missing these is why direct-play failed with
# "PlayerService is not available", BufferQueueError, and mediaxform_create failed: the app
# was never granted access to the services those errors name. Confirmed against
# AmbientFlare/astra-tv, a separate Jellyfin-for-Vega client that plays video successfully
# on real Fire TV hardware and declares this same service set.
[[wants.service]]
id = "com.amazon.w3cmedia.service"

[[wants.service]]
id = "com.amazon.audio.service"

[[wants.service]]
id = "com.amazon.inputmethod.service"

[[wants.service]]
id = "com.amazon.inputd.service"

[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

[[wants.service]]
id = "com.amazon.network.service"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

# Not autolinked (not tied to an npm dependency) - added after seeing this warning in the
# virtual device's log stream during a real run: "Package: 'com.wholphin.vega' is granted
# access ... because the URI is in temporary enforcement exception list. Package should add
# wants/needs module entry to its manifest file to avoid future access control failure."
# (That log line predates the rename to com.vegafin.app; the underlying warning still applies.)
# Required for talking to a Jellyfin server at all.
[[needs.module]]
id = "/com.amazon.kepler.net.net_manager@INetManager"

[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

[[needs.module]]
id = "/com.amazon.kepler.kepler_file_system_0@IKeplerFileSystem_0"

[[needs.module]]
id = "/com.amazon.kepler.kepler_graphics_2@IKeplerGraphics_1"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

[[needs.module]]
id = "/com.amazon.kepler.gesture_handler_4@IGestureHandler_0"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.reanimated_4@IReanimated_0"

[[needs.module]]
id = "/com.amazon.kepler.safe_area_context_8@ISafeAreaContext_0"

[[needs.module]]
id = "/com.amazon.kepler.screens_3@IScreens_0"

[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[[needs.module]]
id = "/com.amazon.kepler.worklets_1@IWorklets_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__core_8@INavigation__Core_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__drawer_8@INavigation__Drawer_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__elements_8@INavigation__Elements_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__native_8@INavigation__Native_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__native_stack_8@INavigation__NativeStack_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__routers_8@INavigation__Routers_0"

[components]
[[components.interactive]]
id = "com.vegafin.app.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main", "com.amazon.category.kepler.media"]
