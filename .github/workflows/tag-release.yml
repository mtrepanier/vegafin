name: Tag Release

# Runs whenever package.json changes on main - which in practice usually means a Prepare
# Release PR (prepare-release.yml) just merged, but package.json can change on main for other
# reasons too (any edit to it, even unrelated to the version field - confirmed the hard way:
# merging this very automation's own PR added an npm script to package.json, which was enough
# to fire this workflow and tag v0.0.1, a version that was never actually bumped). So this only
# actually tags/releases when the version field *itself* changed since the immediately-prior
# commit on main (github.event.before) *and* that version isn't already tagged - either
# condition failing means skip, not just the tag-existence check alone.
#
# Pushing a tag isn't subject to .github/rulesets/protect-main.json's required_signatures rule -
# that ruleset targets the main branch ref specifically, not tag refs - so this can push directly
# with the default GITHUB_TOKEN, unlike prepare-release.yml's version-bump commit.
#
# Also opens a second PR updating CHANGELOG.md with that same release's generated notes - a PR
# for the same reason as prepare-release.yml's version bump: this job can push a *tag* directly,
# but pushing the changelog *commit* to main is a branch-ref change and hits the same
# required_signatures wall a plain runner push can't satisfy on its own.

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write
  pull-requests: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whether the version actually changed and isn't already tagged
        id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PREV_VERSION=""
          if git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
            git show "$BEFORE_SHA:package.json" > /tmp/prev-package.json
            PREV_VERSION=$(node -p "require('/tmp/prev-package.json').version" 2>/dev/null || echo "")
          fi

          if [ "$VERSION" == "$PREV_VERSION" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version field unchanged ($VERSION vs previous $PREV_VERSION) - this push touched package.json for some other reason. Skipping."
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION changed, but v$VERSION is already tagged. Skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Version changed from $PREV_VERSION to $VERSION and isn't tagged yet - proceeding."
          fi

      - name: Tag and create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes

      # Reuses the Release's own generated notes rather than recomputing anything - one source
      # of truth for "what changed," just copied into a repo-tracked file too, for browsing
      # without leaving the source tree and for pasting into an Amazon Appstore "what's new"
      # field at submission time.
      - name: Open CHANGELOG.md update PR
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          NOTES=$(gh release view "v$VERSION" --json body -q .body)
          DATE=$(date -u +%Y-%m-%d)

          # Keeps whatever version entries (lines from the first "## [" heading onward) already
          # existed, discarding only the regenerated header above them - so this works the same
          # whether CHANGELOG.md already has a dozen releases in it or doesn't exist yet.
          EXISTING=""
          if [ -f CHANGELOG.md ]; then
            EXISTING=$(awk '/^## \[/{found=1} found' CHANGELOG.md)
          fi

          {
            echo "# Changelog"
            echo
            echo "All notable changes to VegaFin are tracked here, generated automatically from"
            echo "merged pull requests at release time - see"
            echo "[DEVELOPER.md](DEVELOPER.md#versioning--releases) for how."
            echo
            echo "## [v$VERSION] - $DATE"
            echo
            echo "$NOTES"
            if [ -n "$EXISTING" ]; then
              echo
              echo "$EXISTING"
            fi
          } > CHANGELOG.md

          BRANCH="changelog/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md for v$VERSION"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Update CHANGELOG.md for v$VERSION" \
            --body "Copies the v$VERSION GitHub Release's own generated notes into CHANGELOG.md."
