name: Bug report
description: Report something in VegaFin that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you can give, the faster
        it can get tracked down — VegaFin is only tested on the Vega Virtual Device, so
        real Fire TV/Fire Stick reports are especially useful.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Select '...'
        3. Press '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Vega Virtual Device
        - Physical Fire TV / Fire Stick
        - Other / not sure
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: VegaFin version
      description: Settings → About, or the version tag if you built it yourself.
      placeholder: v0.1.1
    validations:
      required: true

  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin server version
      description: Found in your Jellyfin server's Dashboard.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant logs, or drag in screenshots/screen recordings.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
